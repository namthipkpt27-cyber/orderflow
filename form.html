<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ຟอร์ມ ຂໍ້ມູນການຈັດສົ່ງສິນຄ້າ</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Lao', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md p-6 rounded-2xl shadow-lg border border-gray-100">
        <h2 class="text-xl font-bold text-gray-800 text-center mb-1">📦 ຂໍ້ມູນການຈັດສົ່ງສິນຄ້າ</h2>
        <p class="text-sm text-gray-500 text-center mb-6">ກະລຸນາຕື່ມຂໍ້ມູນຂອງທ່ານໃຫ້ครบถ้วน เพื่อຄວາມສະດວກໃນການຈັດສົ່ງ</p>

        <form id="orderForm" onsubmit="sendToWhatsApp(event)" class="space-y-4">
            <!-- ຊື່ລູກຄ້າ -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">👤 ຊື່ ແລະ ນາມສະກຸນ (ຊື່ລູກຄ້າ)</label>
                <input type="text" id="customerName" required 
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    placeholder="ປອນຊື່-ນາມສະກຸນ ຂອງທ່ານ...">
            </div>

            <!-- เบอร์โทร -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">📞 เบอร์โทรศัพท์ (ຕິດ​ຕໍ່)</label>
                <input type="tel" id="customerPhone" required 
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    placeholder="ຕົວຢ່າງ: 20xxxxxxxx">
            </div>

            <!-- ที่อยู่ และ สาขาขนส่ง -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">📍 ທີ່ຢູ່ຈັດສົ່ງ / ສາຂາຂົນສົ່ງ</label>
                <textarea id="customerAddress" rows="3" required 
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    placeholder="ລະບຸ ບ້ານ, ເມືອງ, ແຂວງ ຫຼື ຊື່ສາຂາຂົນສົ່ງ (J&T, FLASH, XPD ฯลฯ)..."></textarea>
            </div>

            <!-- ปุ่มกดส่ง -->
            <button type="submit" 
                class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl transition duration-200 shadow-md">
                📤 ຢືນຢັນ ແລະ ສົ່ງຂໍ້ມູນຜ່ານ WhatsApp
            </button>
        </form>
    </div>

    <script>
        function formatWhatsAppPhone(phone) {
            if (!phone) return '';
            let cleaned = phone.replace(/\D/g, '');
            if (cleaned.startsWith('0')) {
                cleaned = '856' + cleaned.substring(1);
            } else if (!cleaned.startsWith('856') && cleaned.length >= 8) {
                cleaned = '856' + cleaned;
            }
            return cleaned;
        }

        function sendToWhatsApp(event) {
            event.preventDefault();
            
            const name = document.getElementById('customerName').value.trim();
            const phone = document.getElementById('customerPhone').value.trim();
            const address = document.getElementById('customerAddress').value.trim();

            // เบอร์ WhatsApp ร้านของคุณ (เปลี่ยนเป็นเบอร์ร้านของคุณได้เลย เช่น '85620xxxxxxxx')
            const shopWhatsApp = '8562099999999'; 

            let m = `🛒 *ລູກຄ້າແຈ້ງຂໍ້ມູນການຈັດສົ່ງ*\n`;
            m += `------------------------------------\n`;
            m += `👤 *ຊື່ລູກຄ້າ:* ${name}\n`;
            m += `📞 *ເບີໂທ:* ${phone}\n`;
            m += `📍 *ທີ່ຢູ່ / ສາຂາຂົນສົ່ງ:* ${address}\n`;
            m += `------------------------------------\n`;
            m += `🙏 ຂອບໃຈຫຼາຍໆຄຳ!`;

            const formattedPhone = formatWhatsAppPhone(shopWhatsApp);
            window.open(`https://wa.me/${formattedPhone}?text=${encodeURIComponent(m)}`, '_blank');
        }
    </script>
</body>
</html>
